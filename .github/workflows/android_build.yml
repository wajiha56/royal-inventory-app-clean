name: Android Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Setup Gradle 8.7 (Fully compatible with AGP 8.4.0 out-of-the-box)
    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Unzip and Build APK
      run: |
        echo "=================== STEP 1: UNZIPPING ==================="
        ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
        
        if [ -n "$ZIP_FILE" ]; then
          echo "Found ZIP file: $ZIP_FILE. Unzipping..."
          unzip -o "$ZIP_FILE" -d extracted_project
          
          echo "Listing extracted files structure:"
          find extracted_project -maxdepth 3
          
          TARGET_DIR=$(find extracted_project -type d -name "app" -exec dirname {} \; | head -n 1)
          
          if [ -n "$TARGET_DIR" ]; then
            echo "Switching to project directory: $TARGET_DIR"
            cd "$TARGET_DIR"
          else
            echo "ERROR: 'app' folder not found inside the ZIP file!"
            exit 1
          fi
        else
          echo "No ZIP file found. Building from repository root..."
        fi
        
        echo "=================== STEP 2: AUTO-HEALING CONFIGURATION ==================="
        # Run Python script to fix package typos, inject missing Hilt dependencies, and generate google-services.json
        python3 -c '
        import os
        import json
        
        # 1. Fix "google.dagger" typo in all config files
        files_to_check = [
            "app/build.gradle.kts",
            "build.gradle.kts",
            "gradle/libs.versions.toml",
            "settings.gradle.kts"
        ]
        
        for rel_path in files_to_check:
            if os.path.exists(rel_path):
                print(f"Checking {rel_path} for typos...")
                with open(rel_path, "r") as f:
                    content = f.read()
                
                if "google.dagger" in content:
                    content = content.replace("com.google.dagger", "TEMP_MARKER_DAGGER")
                    content = content.replace("google.dagger", "com.google.dagger")
                    content = content.replace("TEMP_MARKER_DAGGER", "com.google.dagger")
                    
                    with open(rel_path, "w") as f:
                        f.write(content)
                    print(f"Successfully fixed typos in {rel_path}!")

        # 2. Inject missing Hilt plugins and dependencies in app/build.gradle.kts
        filepath = "app/build.gradle.kts"
        if os.path.exists(filepath):
            with open(filepath, "r") as f:
                content = f.read()
            
            modified = False
            
            # Ensure kotlin-kapt is applied inside the plugins block
            if "kapt" not in content:
                if "plugins {" in content:
                    print("Auto-applying kotlin-kapt plugin...")
                    content = content.replace("plugins {", "plugins {\n    id(\"kotlin-kapt\")", 1)
                    modified = True
            
            # Force-inject correct Dagger Hilt dependencies
            if "com.google.dagger:hilt-android" not in content:
                if "dependencies {" in content:
                    print("Auto-injecting missing Dagger Hilt dependencies...")
                    replacement = "dependencies {\n    implementation(\"com.google.dagger:hilt-android:2.51.1\")\n    kapt(\"com.google.dagger:hilt-compiler:2.51.1\")"
                    content = content.replace("dependencies {", replacement, 1)
                    modified = True
            
            if modified:
                with open(filepath, "w") as f:
                    f.write(content)
                print("Successfully healed app/build.gradle.kts!")
                
        # 3. Create dummy google-services.json to satisfy Google Services task
        google_json_path = "app/google-services.json"
        if not os.path.exists(google_json_path):
            print("google-services.json is missing! Creating dummy config...")
            dummy_json = {
                "project_info": {
                    "project_number": "1234567890",
                    "project_id": "dummy-project-id",
                    "storage_bucket": "dummy-project-id.appspot.com"
                },
                "client": [
                    {
                        "client_info": {
                            "mobilesdk_app_id": "1:1234567890:android:abc123xyz",
                            "android_client_info": {
                                "package_name": "com.royal.inventory"
                            }
                        },
                        "oauth_client": [],
                        "api_key": [{"current_key": "dummy-api-key"}],
                        "services": {
                            "appinvite_service": {
                                "other_platform_oauth_client": []
                            }
                        }
                    }
                ],
                "configuration_version": "1"
            }
            with open(google_json_path, "w") as f:
                json.dump(dummy_json, f, indent=4)
            print("Successfully generated dummy google-services.json!")
        '
        
        # 4. Inject AndroidX properties and JVM Memory configurations to resolve compiler thrashing
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties
        echo "org.gradle.daemon=false" >> gradle.properties
        echo "Injected AndroidX and memory configurations into gradle.properties"
        
        echo "=================== STEP 3: RUNNING BUILD WITH GRADLE 8.7 ==================="
        gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
