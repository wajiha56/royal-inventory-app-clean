name: Android Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Build APK
      run: |
        echo "Searching for ZIP files..."
        ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
        
        if [ -n "$ZIP_FILE" ]; then
          echo "Found ZIP file: $ZIP_FILE. Unzipping..."
          unzip -o "$ZIP_FILE" -d extracted_project
          
          # Find where the 'app' directory is located inside the extracted files
          TARGET_DIR=$(find extracted_project -type d -name "app" -exec dirname {} \; | head -n 1)
          
          if [ -n "$TARGET_DIR" ]; then
            echo "Switching to extracted project directory: $TARGET_DIR"
            cd "$TARGET_DIR"
          else
            echo "Error: 'app' directory not found inside the ZIP file!"
            exit 1
          fi
        else
          echo "No ZIP file found. Building from repository root..."
        fi
        
        echo "Current directory contents:"
        ls -la
        
        # Generate gradle wrapper if missing
        if [ ! -f "gradlew" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
