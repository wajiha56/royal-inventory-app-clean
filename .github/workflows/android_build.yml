name: Android Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Build APK
      run: |
        echo "=================== STEP 1: UNZIPPING ==================="
        ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
        
        if [ -n "$ZIP_FILE" ]; then
          echo "Found ZIP file: $ZIP_FILE. Unzipping..."
          unzip -o "$ZIP_FILE" -d extracted_project
          
          echo "Listing extracted files structure:"
          find extracted_project -maxdepth 3
          
          TARGET_DIR=$(find extracted_project -type d -name "app" -exec dirname {} \; | head -n 1)
          
          if [ -n "$TARGET_DIR" ]; then
            echo "Switching to project directory: $TARGET_DIR"
            cd "$TARGET_DIR"
          else
            echo "ERROR: 'app' folder not found inside the ZIP file!"
            exit 1
          fi
        else
          echo "No ZIP file found. Building from repository root..."
        fi
        
        echo "=================== STEP 2: GRADLE PREPARATION ==================="
        # Generate gradle wrapper if missing
        if [ ! -f "gradlew" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper
        fi
        
        chmod +x gradlew
        
        echo "=================== STEP 3: RUNNING BUILD ==================="
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
